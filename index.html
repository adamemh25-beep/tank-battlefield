<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>Tank Battlefield</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Black+Ops+One&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:#555;font-family:'Cairo',Tahoma,sans-serif;color:var(--txt)}
canvas{display:block;position:fixed;inset:0}

.chip{background:var(--panel);padding:5px 10px;border-radius:6px;font-weight:800;font-size:14px}
#bar{width:110px;height:10px;background:#0006;border-radius:5px;overflow:hidden;margin-top:4px}
#hp{height:100%;width:100%;background:var(--rust)}
#stick{position:fixed;left:calc(env(safe-area-inset-left,0px) + 24px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:130px;height:130px;border-radius:50%;background:#2b2a1f55;border:3px solid #2b2a1f99}
#knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:var(--olive);border:3px solid var(--sand)}
#fire,#cm{position:fixed;right:calc(env(safe-area-inset-right,0px) + 26px);border-radius:50%;border:4px solid var(--sand);color:var(--txt);font:800 18px 'Cairo',sans-serif}
#fire{bottom:calc(env(safe-area-inset-bottom,0px) + 36px);width:96px;height:96px;background:var(--rust)}
#fire:active{transform:scale(.94)}
#cm{bottom:calc(env(safe-area-inset-bottom,0px) + 146px);width:64px;height:64px;background:var(--olive);font-size:13px;border-width:3px}
#xh{position:fixed;left:50%;top:50%;width:48px;height:48px;margin:-24px;border:2px solid #ffe36a;border-radius:50%;pointer-events:none}
#xh::after{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;background:#ffe36a;border-radius:50%}
#vg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 55%,#000a 100%)}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1a190f99;padding:20px}
#box{background:var(--panel);padding:22px 20px;border-radius:10px;max-width:350px;text-align:center;border:2px solid var(--olive)}
h1{margin:0 0 6px;font-size:28px;font-weight:800}
p{margin:0 0 14px;line-height:1.7;font-size:15px}
#pk{display:flex;gap:6px;margin-bottom:16px}
.pk{flex:1;background:#0003;color:var(--txt);border:2px solid #fff3;border-radius:8px;padding:8px 2px;font:600 13px 'Cairo',sans-serif;line-height:1.4}
.pk.on{border-color:var(--sand);background:var(--olive)}
button.go{background:var(--olive);color:var(--txt);border:2px solid var(--sand);font:800 20px 'Cairo',sans-serif;padding:8px 34px;border-radius:8px}
#rot{position:fixed;inset:0;z-index:20;background:#14140e;display:none;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:800;padding:30px}
@media (orientation:portrait){#rot{display:flex}}
#mm,#pn{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
#mm{background:linear-gradient(#0006,#000b)}#pn{z-index:6;background:#000b}
#mm h1{font-size:46px;text-shadow:0 3px 10px #000}
#mg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mb{width:190px;background:var(--panel);color:var(--txt);border:2px solid var(--olive);border-radius:8px;padding:8px;font:800 18px 'Cairo',sans-serif}
.mb:disabled{opacity:.4}
.row{display:flex;gap:6px;margin-bottom:12px}
#mn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);background:var(--panel);color:var(--txt);border:2px solid var(--olive);border-radius:6px;font:800 13px 'Cairo',sans-serif;padding:3px 10px}
body.menu #hud,body.menu #stick,body.menu #fire,body.menu #cm,body.menu #mn{display:none}
#mm{direction:ltr;align-items:flex-start;justify-content:flex-end;gap:0;padding:0 0 calc(env(safe-area-inset-bottom,0px) + 16px) calc(env(safe-area-inset-left,0px) + 28px);background:linear-gradient(90deg,#0b0d08ee 0,#0b0d08a0 40%,transparent 72%)}
#lg{margin-bottom:12px;transform:skewX(-8deg)}
#lg b{display:block;font:400 32px/1 'Black Ops One',sans-serif;letter-spacing:2px;color:#f1e8cb;text-shadow:3px 3px 0 #4f5d2f}
#lg i{display:block;font:800 15px 'Cairo',sans-serif;font-style:normal;color:#d8a64a;margin-top:3px;border-top:3px solid #d8a64a;padding-top:2px;width:fit-content}
#mg{display:flex;flex-direction:column;gap:6px}
.mb{width:240px;direction:rtl;text-align:right;transform:skewX(-8deg);background:linear-gradient(90deg,#1b1e14ee,#2a3019ee);border:0;border-left:5px solid #d8a64a;border-radius:0;padding:6px 16px;font:800 17px 'Cairo',sans-serif}
.mb:active{background:#d8a64a;color:#14140e}

#ts button{background:none;border:0;color:#d8a64a;font-size:30px;padding:0 4px}
#tn{font:800 20px 'Cairo',sans-serif;display:block;margin-bottom:4px}
.sr{display:flex;align-items:center;gap:8px;font-size:12px;margin:2px 0}.sr span{width:42px}.sr s{flex:1;height:6px;background:#fff2;display:block}.sr u{display:block;height:100%;background:#d8a64a}
#hud{align-items:flex-start}
#rd{width:110px;height:110px;border-radius:50%;border:3px solid #3fe0c8;box-shadow:0 0 12px #3fe0c8aa}
#ct{display:flex;flex-direction:column;align-items:center;gap:4px}
#tmr{font:800 22px 'Cairo',sans-serif;text-shadow:0 2px 6px #000}
#hb{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;direction:ltr;font:800 13px 'Cairo',sans-serif;text-shadow:0 1px 4px #000}
#bar{width:230px;height:9px;background:#0a2a3acc;border:1px solid #3fe0c8;border-radius:5px;margin:0}
#hp{background:#3fd7ff}
#stick{background:radial-gradient(#3fe0c822,#0a2a3a88);border:3px solid #3fe0c8;box-shadow:0 0 12px #3fe0c855}
#knob{background:radial-gradient(#b8fff0,#3fe0c8);border:0}
#fire{background:radial-gradient(#5ff2dc,#17917f);border:3px solid #9ff8e8;box-shadow:0 0 16px #3fe0c8cc;color:#06332c}
#as,#cm{position:fixed;width:54px;height:54px;border-radius:50%;background:#0a2a3acc;border:3px solid #3fe0c8;color:#9ff8e8;font:800 24px 'Cairo',sans-serif;right:calc(env(safe-area-inset-right,0px) + 36px);bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}
#as.on{background:#3fe0c8;color:#06332c}
#cm{right:calc(env(safe-area-inset-right,0px) + 140px);bottom:calc(env(safe-area-inset-bottom,0px) + 46px);font-size:11px}
#mn{left:auto;right:calc(env(safe-area-inset-right,0px) + 14px);transform:none;width:40px;height:40px;padding:0;background:#0a2a3acc;border:2px solid #3fe0c8;border-radius:6px;color:#9ff8e8}
#xh{border:2px dashed #ffffffaa}
body.menu #hb,body.menu #as,body.menu #xh{display:none}
.hide{display:none!important}
</style>
</head>

<div id="vg" class="hide"></div><div id="xh" class="hide"></div>
<div id="hud"><canvas id="rd" width="120" height="120"></canvas><div id="ct"><div id="tmr">00:00</div><div class="chip" id="mis">المهمة 1</div><div class="chip"><span id="lb">أعداء:</span> <span id="left">0</span></div></div><div style="width:110px"></div></div><div id="hb"><div id="bar"><div id="hp"></div></div><span id="hpv">100%</span></div>
<div id="stick"><div id="knob"></div></div>

<div id="mm"><div id="lg"><b>TANK BATTLEFIELD</b><i>ساحة معركة الدبابات</i></div><div id="mg"><button class="mb" id="b1">لعبة جديدة</button><button class="mb" id="b2">تحميل اللعبة</button><button class="mb" id="b3">الإعدادات</button><button class="mb" id="b4">الكريديت</button></div><div id="ts"><button id="tr">›</button><div><b id="tn"></b><div id="st"></div></div><button id="tl">‹</button></div></div>
<div id="pn" class="hide"><div id="box"><h1 id="pt"></h1><div id="pb"></div><button class="go" id="pc">رجوع</button></div></div>
<div id="ov" class="hide"><div id="box"><h1 id="t">Tank Battlefield</h1><p id="d">دمّر دبابات العدو ف 3 مناطق قتال: صحراء، غابة، مدينة مدمرة. زر "منظور" كيبدل بين الخارجي والداخلي (ف الداخلي كتصوب بالسحب على الشاشة).</p>
<div id="pk"></div><button class="go" id="go">بدا</button></div></div>
